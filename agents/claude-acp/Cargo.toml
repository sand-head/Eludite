# niello-claude-acp: an ACP agent that drives the user's installed `claude`
# CLI over its headless stream-json protocol (brief 0006). Its own workspace
# root during the spike, so the production workspace does not build it yet.
[workspace]

[package]
name = "niello-claude-acp"
description = "Agent Client Protocol adapter for Claude Code, driving the installed `claude` CLI directly (no Node)."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[[bin]]
name = "niello-claude-acp"
path = "src/main.rs"

# Test-only: a fake `claude` that replays recorded stream-json sessions. Not
# under `src/bin/`: the repository's .gitignore ignores `bin/` (.NET output).
[[bin]]
name = "niello-fake-claude"
path = "src/fake_claude_main.rs"
test = false

[dependencies]
agent-client-protocol = "=2.2.0" # Apache-2.0
futures = "0.3" # MIT OR Apache-2.0
serde_json = "1" # MIT OR Apache-2.0
uuid = { version = "1", features = ["v4"] } # Apache-2.0 OR MIT

[dev-dependencies]
# The brief 0005 ACP client (GPL-3.0-or-later), used only by the tests to drive
# the adapter as Niello does; it is not linked into the shipped binary.
niello-acp = { path = "../../crates/acp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
