name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libssl-dev libgit2-dev \
            pkg-config cmake clang xvfb

      # With no arguments, rustup installs the toolchain (and components)
      # pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Brief 0030: the agent debugging proving scenario (crates/eludite/src/shell/agents/tests.rs) debugs the
      # seeded-bug corpus (corpus/debugging) under netcoredbg on every platform. The .NET SDK builds the corpus;
      # tools/netcoredbg/fetch.sh fetches the adapter, cached on the release and checksums the script pins (Git Bash
      # runs it on Windows, where the path is converted for the tests).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache netcoredbg
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ hashFiles('tools/netcoredbg/fetch.sh') }}

      - name: Fetch netcoredbg
        shell: bash
        run: |
          netcoredbg="$(tools/netcoredbg/fetch.sh)"
          if command -v cygpath >/dev/null 2>&1; then netcoredbg="$(cygpath -w "$netcoredbg")"; fi
          echo "ELUDITE_NETCOREDBG=$netcoredbg" >> "$GITHUB_ENV"

      - name: Build the debugging corpus
        if: runner.os != 'Windows'
        run: corpus/debugging/build.sh

      - name: Build the debugging corpus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: corpus/debugging/build.ps1

      - name: Format
        run: cargo fmt --check

      # eludite-chromium (brief 0031) builds its real engine only with the `cef` feature, against CEF fetched by
      # tools/cef/fetch.sh (326 MB, cached on the pin). Linux builds, lints and tests it; Windows and macOS build the
      # crate without the feature (the executable then only says how to get CEF) and its tests skip.
      - name: Cache CEF
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/cef
          key: cef-${{ runner.os }}-${{ hashFiles('tools/cef/PIN') }}

      - name: Fetch CEF
        if: runner.os == 'Linux'
        run: |
          cef="$(tools/cef/fetch.sh)"
          echo "CEF_PATH=$cef" >> "$GITHUB_ENV"
          echo "CEF_FEATURES=--features eludite-chromium/cef" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.CEF_FEATURES }} -- -D warnings

      - name: Build
        run: cargo build --workspace ${{ env.CEF_FEATURES }}

      # The browser tests (crates/browser/tests/chrome.rs, brief 0023) run on Linux against Chrome for Testing,
      # pinned in tools/chrome/PIN. On Windows and macOS they skip themselves unless ELUDITE_CHROME is set.
      - name: Cache Chrome for Testing
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/chrome
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('tools/chrome/PIN') }}

      - name: Fetch Chrome for Testing
        if: runner.os == 'Linux'
        run: |
          chrome="$(tools/chrome/fetch.sh)"
          echo "ELUDITE_CHROME=$chrome" >> "$GITHUB_ENV"
          # Ubuntu's AppArmor policy blocks the user namespaces Chrome's sandbox needs on the hosted runners; the
          # tests then launch Chrome with --no-sandbox, which only this variable adds.
          echo "ELUDITE_CHROME_NO_SANDBOX=1" >> "$GITHUB_ENV"
          "$chrome" --version

      # On Linux the engine tests (browsers/chromium/tests, crates/browser/tests/embedded.rs) run CEF under Xvfb;
      # ELUDITE_CHROME_NO_SANDBOX=1 (set above) also covers CEF, whose sandbox meets the same AppArmor policy.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace ${{ env.CEF_FEATURES }}

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # The scenario ran in the step above; this runs it again alone and prints its call lists, sizes and times. Same
      # features as the test step, so nothing is rebuilt.
      - name: Debug proving scenario
        shell: bash
        run: cargo test --workspace ${{ env.CEF_FEATURES }} -- a_scripted_agent_finds the_corpus_programs --nocapture

  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # eludite-dbg-mono's tests debug a program under Mono (brief 0022); without Mono they skip, as on Windows.
      - name: Install Mono
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-devel

      - name: Build
        run: dotnet build dotnet/Eludite.slnx --configuration Release

      - name: Test
        run: dotnet test dotnet/Eludite.slnx --configuration Release --no-build
