name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libssl-dev libgit2-dev \
            pkg-config cmake clang

      # With no arguments, rustup installs the toolchain (and components)
      # pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # The browser tests (crates/browser/tests/chrome.rs, brief 0023) run on Linux against Chrome for Testing,
      # pinned in tools/chrome/PIN. On Windows and macOS they skip themselves unless ELUDITE_CHROME is set.
      - name: Cache Chrome for Testing
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/chrome
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('tools/chrome/PIN') }}

      - name: Fetch Chrome for Testing
        if: runner.os == 'Linux'
        run: |
          chrome="$(tools/chrome/fetch.sh)"
          echo "ELUDITE_CHROME=$chrome" >> "$GITHUB_ENV"
          # Ubuntu's AppArmor policy blocks the user namespaces Chrome's sandbox needs on the hosted runners; the
          # tests then launch Chrome with --no-sandbox, which only this variable adds.
          echo "ELUDITE_CHROME_NO_SANDBOX=1" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Test
        run: cargo test --workspace

  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # eludite-dbg-mono's tests debug a program under Mono (brief 0022); without Mono they skip, as on Windows.
      - name: Install Mono
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-devel

      - name: Build
        run: dotnet build dotnet/Eludite.slnx --configuration Release

      - name: Test
        run: dotnet test dotnet/Eludite.slnx --configuration Release --no-build
