name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libssl-dev libgit2-dev \
            pkg-config cmake clang xvfb
          # Brief 0033: the DAP corpus's re-record check (below) runs the real adapters: eludite-dbg-mono under Mono
          # and lldb-dap 18.
          sudo apt-get install -y --no-install-recommends mono-devel lldb-18

      # With no arguments, rustup installs the toolchain (and components)
      # pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Brief 0030: the agent debugging proving scenario (crates/eludite/src/shell/agents/tests.rs) debugs the
      # seeded-bug corpus (corpus/debugging) under netcoredbg on every platform. The .NET SDK builds the corpus;
      # tools/netcoredbg/fetch.sh fetches the adapter, cached on the release and checksums the script pins (Git Bash
      # runs it on Windows, where the path is converted for the tests).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache netcoredbg
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/netcoredbg
          key: netcoredbg-${{ runner.os }}-${{ hashFiles('tools/netcoredbg/fetch.sh') }}

      - name: Fetch netcoredbg
        shell: bash
        run: |
          netcoredbg="$(tools/netcoredbg/fetch.sh)"
          if command -v cygpath >/dev/null 2>&1; then netcoredbg="$(cygpath -w "$netcoredbg")"; fi
          echo "ELUDITE_NETCOREDBG=$netcoredbg" >> "$GITHUB_ENV"

      - name: Build the debugging corpus
        if: runner.os != 'Windows'
        run: corpus/debugging/build.sh

      - name: Build the debugging corpus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: corpus/debugging/build.ps1

      # Brief 0035: the Test Explorer corpus, for crates/lsp/tests/real_host.rs and the shell's Test Explorer tests.
      - name: Build the test corpus
        if: runner.os != 'Windows'
        run: corpus/tests/build.sh

      - name: Build the test corpus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: corpus/tests/build.ps1

      - name: Format
        run: cargo fmt --check

      # eludite-chromium (brief 0031) builds its real engine only with the `cef` feature, against CEF fetched by
      # tools/cef/fetch.sh (326 MB, cached on the pin). Linux builds, lints and tests it; Windows and macOS build the
      # crate without the feature (the executable then only says how to get CEF) and its tests skip.
      - name: Cache CEF
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/cef
          key: cef-${{ runner.os }}-${{ hashFiles('tools/cef/PIN') }}

      - name: Fetch CEF
        if: runner.os == 'Linux'
        run: |
          cef="$(tools/cef/fetch.sh)"
          echo "CEF_PATH=$cef" >> "$GITHUB_ENV"
          echo "CEF_FEATURES=--features eludite-chromium/cef" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.CEF_FEATURES }} -- -D warnings

      - name: Build
        run: cargo build --workspace ${{ env.CEF_FEATURES }}

      # The browser tests (crates/browser/tests/chrome.rs, brief 0023) run on Linux against Chrome for Testing,
      # pinned in tools/chrome/PIN. On Windows and macOS they skip themselves unless ELUDITE_CHROME is set.
      - name: Cache Chrome for Testing
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/chrome
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('tools/chrome/PIN') }}

      - name: Fetch Chrome for Testing
        if: runner.os == 'Linux'
        run: |
          chrome="$(tools/chrome/fetch.sh)"
          echo "ELUDITE_CHROME=$chrome" >> "$GITHUB_ENV"
          # Ubuntu's AppArmor policy blocks the user namespaces Chrome's sandbox needs on the hosted runners; the
          # tests then launch Chrome with --no-sandbox, which only this variable adds.
          echo "ELUDITE_CHROME_NO_SANDBOX=1" >> "$GITHUB_ENV"
          "$chrome" --version

      # JavaScript debugging (brief 0038) runs vscode-js-debug under Node.js; the js-debug corpus recordings carry the
      # Node version they were made with, so CI pins it rather than re-recording on every runner image change.
      - name: Set up Node.js for vscode-js-debug
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Cache vscode-js-debug
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/js-debug
          key: js-debug-${{ runner.os }}-${{ hashFiles('tools/js-debug/PIN') }}

      - name: Fetch vscode-js-debug
        if: runner.os == 'Linux'
        run: |
          server="$(tools/js-debug/fetch.sh)"
          echo "ELUDITE_JS_DEBUG=$server" >> "$GITHUB_ENV"
          node --version

      # On Linux the engine tests (browsers/chromium/tests, crates/browser/tests/embedded.rs) run CEF under Xvfb;
      # ELUDITE_CHROME_NO_SANDBOX=1 (set above) also covers CEF, whose sandbox meets the same AppArmor policy: the shell and
      # the tests turn it into the engine's --allow-no-sandbox (brief 0039).
      # Ubuntu's AppArmor denies unprivileged user namespaces to unconfined programs on the hosted runners (since the
      # 24.04 images of September 2026); Chromium then falls back to the setuid helper, which a build folder does not
      # hold root-owned, and aborts. The sysctl lets the namespace sandbox work, as on a desktop.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace ${{ env.CEF_FEATURES }}

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # Brief 0039's Linux package and its smoke test run in the package job below, which uploads the archives.

      # The scenario ran in the step above; this runs it again alone and prints its call lists, sizes and times. Same
      # features as the test step, so nothing is rebuilt.
      - name: Debug proving scenario
        shell: bash
        run: cargo test --workspace ${{ env.CEF_FEATURES }} -- a_scripted_agent_finds the_corpus_programs --nocapture

      # Brief 0033: the DAP conformance tests replay the recorded sessions in corpus/dap through the shell on every
      # platform with no adapter installed (they ran in the test step; this runs them alone and prints their times).
      - name: DAP conformance corpus
        shell: bash
        run: cargo test --workspace ${{ env.CEF_FEATURES }} -- "conformance_tests::" --nocapture

      # The corpus is kept honest: Linux re-records the Mono and lldb-dap sessions from the real adapters and fails
      # when one differs from the checked-in recording beyond timing (an adapter upgrade or a shell change). Re-record
      # with tools/dap-corpus/record.sh and review the diff.
      - name: Re-record the DAP corpus (Mono, lldb-dap, js-debug)
        if: runner.os == 'Linux'
        env:
          RECORD_DAP: ${{ runner.temp }}/dap-corpus
        run: |
          # lldb-dap attaches to a process it did not start (lldb/attach-detach); Ubuntu's Yama policy lets only a
          # process's ancestors attach unless ptrace_scope is 0.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          tools/dap-corpus/record.sh --check mono lldb js-debug

      # netcoredbg cannot be downloaded where the corpus was first recorded: Linux records its sessions here and
      # uploads them (artifact dap-corpus-netcoredbg) to be reviewed and checked in under corpus/dap/netcoredbg.
      # It does not fail the job until those first recordings are checked in.
      - name: Record the DAP corpus (netcoredbg)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          RECORD_DAP: ${{ runner.temp }}/dap-corpus
        run: tools/dap-corpus/record.sh --check netcoredbg

      - name: Upload the DAP recordings
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dap-corpus-netcoredbg
          path: ${{ runner.temp }}/dap-corpus/netcoredbg
          if-no-files-found: warn

  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # eludite-dbg-mono's tests debug a program under Mono (brief 0022); without Mono they skip, as on Windows.
      - name: Install Mono
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-devel

      - name: Build
        run: dotnet build dotnet/Eludite.slnx --configuration Release

      # Brief 0035: the Test Explorer corpus's .NET projects (MTP and VSTest), which the bridge's and the host's tests
      # also build in a temp folder of their own.
      - name: Build the test corpus
        if: runner.os != 'Windows'
        run: corpus/tests/build.sh --no-cargo

      - name: Build the test corpus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: corpus/tests/build.ps1 -NoCargo

      - name: Test
        run: dotnet test dotnet/Eludite.slnx --configuration Release --no-build

  # The archives to download and run without building (tools/package/): on Linux brief 0039's tarball with the browser
  # engine and CEF, on Windows and macOS the shell-only archive (the engine is Linux-only so far), each with the .NET host,
  # eludite-dbg-mono and eludite-claude-acp beside the shell (companions.sh). Release builds, so this job runs beside the
  # test jobs rather than after them. Each archive is this run's artifact eludite-<version>-<os>-<arch>.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-x11-dev libvulkan-dev \
            libfontconfig1-dev libssl-dev libgit2-dev \
            pkg-config cmake clang xvfb desktop-file-utils

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      # agents/claude-acp is its own cargo workspace (companions.sh builds it).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            agents/claude-acp
          cache-on-failure: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache CEF
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/eludite/cef
          key: cef-${{ runner.os }}-${{ hashFiles('tools/cef/PIN') }}

      # linux.sh fetches CEF itself when the cache missed.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          archive="$(tools/package/linux.sh --with-companions --out "${{ runner.temp }}/package")"
          ls -l "$archive"

      - name: Package (Windows, macOS)
        if: runner.os != 'Linux'
        run: |
          out="$RUNNER_TEMP/package"
          if command -v cygpath >/dev/null 2>&1; then out="$(cygpath -u "$RUNNER_TEMP")/package"; fi
          archive="$(tools/package/shell.sh --out "$out")"
          ls -l "$archive"

      - name: Name the artifact
        id: name
        run: |
          # Git Bash's globbing needs the POSIX spelling of RUNNER_TEMP, not D:\a\_temp.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          shopt -s nullglob
          set -- "$tmp"/package/eludite-*.tar.gz "$tmp"/package/eludite-*.zip
          [ $# -eq 1 ] || { echo "expected one archive, found: $*" >&2; exit 1; }
          name="$(basename "$1")"; name="${name%.tar.gz}"; name="${name%.zip}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ runner.temp }}/package/eludite-*.tar.gz
            ${{ runner.temp }}/package/eludite-*.zip
          if-no-files-found: error
          compression-level: 0

      # Brief 0039's smoke test (browsers/chromium/tests/package.rs) runs eludite and eludite-chromium from the uploaded
      # tarball with no CEF_PATH, ELUDITE_CEF, ELUDITE_CHROMIUM or CEF cache in their environment (CEF_PATH here only
      # builds the test). It runs after the upload so a failing engine still leaves the archive to download. Ubuntu's
      # AppArmor denies unprivileged user namespaces to unconfined programs on the hosted runners, so Chromium falls back
      # to the setuid helper, which a tarball cannot ship root-owned, and aborts; the sysctl lets the namespace sandbox
      # work, as it does on a desktop. ELUDITE_CHROME_NO_SANDBOX=1 stays as the rust job's fallback.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export CEF_PATH="$(tools/cef/fetch.sh)"
          xvfb-run -a env ELUDITE_PACKAGE_TARBALL="${{ runner.temp }}/package/$(basename "$(ls "${{ runner.temp }}"/package/eludite-*.tar.gz)")" \
            ELUDITE_CHROME_NO_SANDBOX=1 \
            cargo test -p eludite-chromium --features cef --test package -- --nocapture
