[package]
name = "eludite-search"
description = "Eludite Find in Files and Replace in Files: ripgrep's walker and matcher, the open-documents overlay, the replacement engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The directory walker with .gitignore support and parallel walking (ripgrep's). Unlicense OR MIT; brief 0042.
ignore.workspace = true
# ripgrep's regex matcher (literal fast paths, line terminators) and its line searcher. Unlicense OR MIT; brief 0042.
grep-regex.workspace = true
grep-searcher.workspace = true
# The line terminator type the searcher and the matcher share (CRLF mode, so `$` matches before `\r\n`). Unlicense OR
# MIT; not a new crate: grep-regex and grep-searcher depend on it.
grep-matcher = "0.1.9"
# The match ranges and the capture groups of a matching line, and the replacement's `$1` expansion. MIT OR
# Apache-2.0; already in the build (GPUI, eludite-commands, grep-regex's own regex-automata).
regex = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
