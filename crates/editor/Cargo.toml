[package]
name = "niello-editor"
description = "Niello editor core: buffer, editor view and syntax highlighting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clock.workspace = true
futures = "0.3" # MIT OR Apache-2.0; already in the build through GPUI
gpui.workspace = true
niello-ui.workspace = true
text.workspace = true
# tree-sitter and its grammars (all MIT); versions recorded in docs/briefs/0009-report.md.
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-rust = "0.24"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
serde_json.workspace = true

[[example]]
name = "viewer"
path = "examples/viewer.rs"

[lints]
workspace = true
