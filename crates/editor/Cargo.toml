[package]
name = "eludite-editor"
description = "Eludite editor core: buffer, editor view and syntax highlighting."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clock.workspace = true
futures = "0.3" # MIT OR Apache-2.0; already in the build through GPUI
# Fuzzy filtering of the completion list (vendored from Zed, GPL-3.0-or-later; brief 0013).
fuzzy.workspace = true
gpui.workspace = true
eludite-ui.workspace = true
# tree-sitter's allocator (src/syntax/alloc.rs); MIT.
libmimalloc-sys.workspace = true
text.workspace = true
# tree-sitter and its grammars (all MIT); versions recorded in docs/briefs/0009-report.md and, for the web
# grammars, docs/briefs/0050-report.md.
tree-sitter = "0.27"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
mimalloc.workspace = true
serde_json.workspace = true

[features]
# Build the example viewer with mimalloc as the global allocator instead of
# the system one, to compare the two (brief 0011).
mimalloc-global = []

[[example]]
name = "viewer"
path = "examples/viewer.rs"

[lints]
workspace = true
