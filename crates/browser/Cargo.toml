[package]
name = "eludite-browser"
description = "Eludite's browser automation: the engine trait, the CDP client and the eludite.browser.* commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
eludite-commands.workspace = true
# The generated Chrome DevTools Protocol types (protocol/rust/src/cdp/, brief 0023).
eludite-protocol = { workspace = true, features = ["cdp"] }
# `/regex/` patterns of console and network filters. MIT OR Apache-2.0; already in the build through GPUI.
regex = "1"
serde.workspace = true
serde_json.workspace = true
# Encoding screenshots taken from the embedded engine's frame ring (brief 0031) and `record`'s GIF (brief 0032).
# MIT OR Apache-2.0; already in the build through GPUI, with these features (`gif` included: no new crate).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# The CDP websocket over std::net::TcpStream: no TLS, no async runtime. MIT OR Apache-2.0.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
# The embedded engine's shared memory and descriptor passing (brief 0031). MIT OR Apache-2.0; already in the build.
libc = "0.2"

[dev-dependencies]
# Timing budgets, hang bounds and required tools shared by every test (crates/test-support).
eludite-test-support.workspace = true
tempfile.workspace = true

[lints]
workspace = true
