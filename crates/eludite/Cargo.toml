[package]
name = "eludite"
description = "Eludite: a native, agent-first IDE for .NET."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "eludite"

[[bin]]
name = "eludite"
path = "src/main.rs"

[dependencies]
clock.workspace = true
futures = "0.3" # MIT OR Apache-2.0; already in the build through GPUI
gpui.workspace = true
gpui_platform.workspace = true
# Decoding and scaling the Agents window's thumbnails (brief 0024). MIT OR Apache-2.0; already in the build through
# GPUI, with these features.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eludite-acp.workspace = true
# The browser of eludite.browser.* (brief 0023): the engine trait, the external Chrome over CDP.
eludite-browser.workspace = true
eludite-commands.workspace = true
# The DAP client, netcoredbg discovery and launch configuration (brief 0018).
eludite-dap.workspace = true
eludite-docking.workspace = true
eludite-editor.workspace = true
# libgit2 for the Git Changes and Git Repository windows and eludite.git.* (brief 0040).
eludite-git.workspace = true
eludite-search.workspace = true
eludite-forge.workspace = true
eludite-terminal.workspace = true
eludite-lsp.workspace = true
eludite-mcp.workspace = true
# Typed request markers for the shell's IntelliSense requests (MIT; already a dependency of eludite-lsp).
eludite-protocol.workspace = true
eludite-ui.workspace = true
eludite-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The scripted fake debug adapter (crates/dap, feature `fake`) for the debugger tests, and the replaying adapter
# (feature `replay`) for the DAP conformance tests (brief 0033).
eludite-dap = { workspace = true, features = ["fake", "replay"] }
gpui = { workspace = true, features = ["test-support"] }
# The in-process fake eludite-host (crates/lsp, feature `fake`) for the open-solution tests.
eludite-lsp = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
