[package]
name = "eludite"
description = "Eludite: a native, agent-first IDE for .NET."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "eludite"

[[bin]]
name = "eludite"
path = "src/main.rs"

[dependencies]
clock.workspace = true
futures = "0.3" # MIT OR Apache-2.0; already in the build through GPUI
gpui.workspace = true
gpui_platform.workspace = true
eludite-acp.workspace = true
eludite-commands.workspace = true
eludite-docking.workspace = true
eludite-editor.workspace = true
eludite-lsp.workspace = true
eludite-mcp.workspace = true
# Typed request markers for the shell's IntelliSense requests (MIT; already a dependency of eludite-lsp).
eludite-protocol.workspace = true
eludite-ui.workspace = true
eludite-workspace.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The in-process fake eludite-host (crates/lsp, feature `fake`) for the open-solution tests.
eludite-lsp = { workspace = true, features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
