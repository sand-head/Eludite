[package]
name = "eludite"
description = "Eludite: a native, agent-first IDE for .NET."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "eludite"

[[bin]]
name = "eludite"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
eludite-commands.workspace = true
eludite-docking.workspace = true
eludite-ui.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
