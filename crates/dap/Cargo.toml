[package]
name = "eludite-dap"
description = "Eludite DAP client and transports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The Node.js search, shared with the web language servers (brief 0050).
eludite-lsp.workspace = true
eludite-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
# [package.metadata.eludite.run] in Cargo.toml (brief 0029).
toml.workspace = true

# The process list's Toolhelp32 snapshot on Windows (brief 0027's attach). MIT OR Apache-2.0, the version
# eludite-dbg-netfx uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
# fake: a scripted fake debug adapter for the client's and the shell's tests.
fake = []
# replay: the replaying adapter that serves a recorded session (brief 0033's conformance tests).
replay = []

[dev-dependencies]
eludite-dap = { path = ".", features = ["fake", "replay"] }
tempfile.workspace = true

[lints]
workspace = true

# The client against the fake adapter as a child process over stdio. The binary serves the fake when
# ELUDITE_FAKE_DAP is set and runs the tests otherwise, so it has its own main (no libtest harness on stdout).
[[test]]
name = "stdio"
harness = false
