[package]
name = "eludite-terminal"
description = "Eludite integrated terminal: a PTY, alacritty_terminal's emulator and our own GPUI view."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The terminal emulator and the PTY (Unix PTYs, ConPTY on Windows): brief 0041's one new dependency. Apache-2.0.
alacritty_terminal = { version = "0.26", default-features = false }
eludite-ui.workspace = true
gpui.workspace = true
# Waiting on the PTY and its child the way alacritty_terminal's own event loop does. MIT OR Apache-2.0; already in
# the build through GPUI and alacritty_terminal.
polling = "3"
# eludite.terminal.wait's `pattern` and the link detector. MIT OR Apache-2.0; already in the build through GPUI.
regex = "1"
serde.workspace = true

[target.'cfg(unix)'.dependencies]
# The terminal's foreground process group (a running command) and killing it. MIT OR Apache-2.0; already in the
# build.
libc = "0.2"

[dev-dependencies]
# Timing budgets, hang bounds and required tools shared by every test (crates/test-support).
eludite-test-support.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
