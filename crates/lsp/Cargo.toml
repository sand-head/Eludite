[package]
name = "eludite-lsp"
description = "Eludite LSP client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
eludite-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# fake::FakeHost, a scripted in-process eludite-host for tests of the client and the shell.
fake = []

[lints]
workspace = true

# A scripted fake eludite-host and the client tests that drive it. The binary runs as the fake host when
# ELUDITE_FAKE_HOST=1 and as the test runner otherwise, so it has its own main (no libtest harness writing to stdout).
[[test]]
name = "fake_host"
harness = false

[dev-dependencies]
# Timing budgets, hang bounds and required tools shared by every test (crates/test-support).
eludite-test-support.workspace = true
tempfile.workspace = true
# The in_process tests use the fake host from this crate's own `fake` feature.
eludite-lsp = { path = ".", features = ["fake"] }
