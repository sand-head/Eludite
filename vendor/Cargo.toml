# Workspace for the vendored Zed crates (see README.md and each WHY.md).
#
# It mirrors the parts of Zed's root Cargo.toml, at the GPUI pin, that these
# crates inherit through `*.workspace = true`, including Zed's own lint table.
# Keeping that here, rather than making the crates members of Niello's root
# workspace, lets the vendored manifests stay byte-identical to upstream and
# keeps Niello's stricter lints (`clippy::all`, `unsafe_code`) off code we do
# not own. The root workspace excludes `vendor/` and uses these crates by path;
# its `[patch]` section points GPUI's git copies at them.
#
# Upstream tests: `cargo test --manifest-path vendor/Cargo.toml --workspace --all-features`.

[workspace]
resolver = "3"
members = ["sum_tree", "rope", "text", "clock", "fuzzy"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# Vendored (this directory).
clock = { path = "clock" }
fuzzy = { path = "fuzzy" }
rope = { path = "rope" }
sum_tree = { path = "sum_tree" }
text = { path = "text" }

# Zed support crates, by git at the GPUI pin (Apache-2.0; brief 0001 audit: "depend by git").
collections = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8", version = "0.1.0" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8", default-features = false }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
path = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
util = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
zlog = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
ztracing = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }

# Third-party, with the same requirements as Zed's root Cargo.toml at the pin.
anyhow = "1.0.86"
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
heapless = "0.9.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
rand = "0.9"
rayon = "1.8"
regex = "1.5"
serde = { version = "1.0.221", features = ["derive", "rc"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
tracing = "0.1.40"
unicode-segmentation = "1.10"

# Zed's lint table at the pin, so the vendored code is held to upstream's rules.
[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

# Same patch as the root manifest, so a standalone build here also has one copy.
[patch."https://github.com/zed-industries/zed"]
sum_tree = { path = "sum_tree" }

[profile.dev.package."*"]
opt-level = 2
